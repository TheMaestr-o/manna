<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MANNA — Sabbath Bible Lesson · parallel languages</title>
<meta name="description" content="The daily Sabbath Bible Lesson in two languages side by side, with the full Bible text.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f4efe4; --cream2:#ece5d4; --panel:#efe9db; --ink:#2a2723; --soft:#6d675b;
  --faint:#a49c8b; --tan:#a88f6d; --tan-dk:#8c7454; --line:#e2dbc9; --hair:#e8e1d1;
  --display:"Playfair Display","Times New Roman",serif;
  --read:"Cormorant Garamond",Georgia,serif;
  --sans:"Jost","SF Pro Text",-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;font-weight:300;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 40px}
a{color:var(--tan-dk);text-decoration:none}
a:hover{color:var(--ink)}

/* nav */
.nav{position:sticky;top:0;z-index:9;background:rgba(244,239,228,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--hair)}
.nav-in{max-width:1120px;margin:0 auto;padding:20px 40px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.brand{grid-column:2;font-family:var(--display);font-size:23px;font-weight:500;letter-spacing:7px;padding-left:7px;text-align:center}
.menu{grid-column:3;justify-self:end;display:flex;align-items:center;gap:9px;cursor:pointer;color:var(--soft);
  font-size:12px;letter-spacing:2px;text-transform:uppercase}
.menu:hover{color:var(--ink)}
.menu .bars{display:inline-flex;flex-direction:column;gap:3.5px}
.menu .bars i{display:block;width:22px;height:1.4px;background:currentColor}

/* drawer */
.drawer{border-bottom:1px solid var(--hair);background:var(--panel);overflow:hidden;max-height:0;transition:max-height .35s ease}
.drawer.open{max-height:240px}
.drawer-in{max-width:1120px;margin:0 auto;padding:20px 40px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:16px 30px}
.pickset{display:flex;align-items:center;gap:10px}
.pk-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--faint)}
.seg{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden;background:var(--cream)}
.seg .o{padding:8px 14px;font-size:12px;letter-spacing:1.5px;color:var(--soft);cursor:pointer;transition:.15s}
.seg .o:hover{color:var(--ink)}
.seg .o.active{background:var(--tan);color:#fff}
.swap{width:38px;height:35px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:2px;
  background:var(--cream);color:var(--tan-dk);cursor:pointer;font-size:15px}
.swap:hover{background:var(--tan);color:#fff}
.editions{display:flex;align-items:center;gap:14px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--faint)}
.editions a{color:var(--faint)}.editions a:hover{color:var(--ink)}
.editions .cur{color:var(--tan-dk);border-bottom:1px solid var(--tan)}

/* hero */
.hero{text-align:center;padding:64px 0 30px}
.eyebrow{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--tan-dk);margin-bottom:26px}
.daynav{display:inline-flex;align-items:center;gap:20px}
.arrow{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--line);
  color:var(--soft);font-size:20px;cursor:pointer;user-select:none;transition:.2s;background:var(--cream)}
.arrow:hover{border-color:var(--tan);color:var(--tan-dk)}
.date{cursor:pointer;min-width:230px}
.date .d{font-family:var(--display);font-size:30px;font-weight:500;text-transform:capitalize;line-height:1.1}
.date .s{font-size:10.5px;letter-spacing:3px;color:var(--faint);margin-top:8px}
.date.today .s{color:var(--tan-dk)}
.hrule{width:44px;height:1px;background:var(--tan);margin:30px auto 0;opacity:.7}

/* columns */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:60px;padding:20px 0 90px}
.cols::before{content:"";position:absolute}
.col{min-width:0}
.msg{grid-column:1/-1;text-align:center;color:var(--faint);padding:70px 20px;font-family:var(--read);font-size:20px;font-style:italic}

.kick{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--tan-dk);margin-bottom:12px;text-align:center}
.title{font-family:var(--display);font-size:31px;font-weight:500;line-height:1.16;text-align:center;margin-bottom:26px}
.mem{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 0;margin-bottom:30px;text-align:center}
.mem .l{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--faint);margin-bottom:12px}
.mem .t{font-family:var(--read);font-size:22px;font-style:italic;line-height:1.5;color:var(--ink)}
.mem .r{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--tan-dk);margin-top:14px}
.section{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--soft);text-align:center;margin:6px 0 26px;
  display:flex;align-items:center;gap:16px}
.section::before,.section::after{content:"";flex:1;height:1px;background:var(--line)}
.qa{margin-bottom:34px}
.qa:not(:last-child){border-bottom:1px solid var(--hair);padding-bottom:34px}
.q{font-size:15px;font-weight:400;line-height:1.6;color:var(--ink);margin-bottom:16px;letter-spacing:.2px}
.vref{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--tan-dk);margin-bottom:8px;text-align:center}
.verse{font-family:var(--read);font-size:20px;line-height:1.55;color:var(--ink);padding:4px 6px 4px 0;margin-bottom:12px;
  text-align:justify;hyphens:auto}
.vnum{font-family:var(--sans);font-weight:500;font-size:10px;color:var(--tan);vertical-align:4px;margin:0 4px 0 1px;letter-spacing:0}
.note{font-size:14px;line-height:1.7;color:var(--soft);margin-top:14px;text-align:justify;hyphens:auto}
.review{font-family:var(--read);font-size:19px;line-height:1.5;color:var(--ink);margin-bottom:16px}
.reading{font-size:14px;color:var(--soft);margin-top:14px;font-style:italic}
.reading b{font-style:normal;color:var(--ink);font-weight:500}

footer{text-align:center;color:var(--faint);font-size:12px;letter-spacing:.5px;padding:34px 0 50px;border-top:1px solid var(--hair)}
footer a{color:var(--tan-dk)}

@media (prefers-reduced-motion:no-preference){
  @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .hero>*{animation:fade .7s both}
  .eyebrow{animation-delay:.02s}.daynav{animation-delay:.1s}.hrule{animation-delay:.2s}
  .col{animation:fade .7s both}.col:nth-child(2){animation-delay:.1s}
  .col .kick{animation:fade .5s .05s both}.col .title{animation:fade .55s .1s both}
  .col .mem{animation:fade .6s .18s both}.col .section{animation:fade .55s .24s both}
  .col .qa{animation:fade .55s .3s both}.col .qa:nth-of-type(n+2){animation-delay:.4s}
  .arrow,.swap,.seg .o{transition:.2s}
}
@media (max-width:820px){
  .wrap,.nav-in,.drawer-in{padding-left:22px;padding-right:22px}
  .cols{grid-template-columns:1fr;gap:0}
  .col{border-bottom:1px solid var(--hair);padding-bottom:26px;margin-bottom:30px}
  .col:last-child{border-bottom:none}
  .date .d{font-size:25px}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-in">
    <div class="brand">MANNA</div>
    <div class="menu" id="menu" role="button" tabindex="0"><span>menu</span><span class="bars"><i></i><i></i></span></div>
  </div>
  <div class="drawer" id="drawer">
    <div class="drawer-in">
      <div class="pickset"><span class="pk-label">Left</span><div class="seg" id="seg-left"></div>
        <div class="swap" id="swap" title="Swap sides">&#8646;</div>
        <span class="pk-label">Right</span><div class="seg" id="seg-right"></div></div>
      <div class="editions"><span class="cur">Light</span><a href="dark.html">Dark</a><a href="codex.html">Illuminated</a></div>
    </div>
  </div>
</nav>

<div class="wrap">
  <div class="hero">
    <div class="eyebrow" id="eyebrow">Sabbath Bible Lesson</div>
    <div class="daynav">
      <div class="arrow" id="prev" title="Previous day">&lsaquo;</div>
      <div class="date" id="date" title="Jump to today"><div class="d" id="date-d">&mdash;</div><div class="s" id="date-s"></div></div>
      <div class="arrow" id="next" title="Next day">&rsaquo;</div>
    </div>
    <div class="hrule"></div>
  </div>
  <div class="cols" id="cols"><div class="msg">&hellip;</div></div>
</div>

<footer>
  Content &copy; <a href="https://sdarm.org" target="_blank" rel="noopener">Seventh Day Adventist Reform Movement</a> &middot;
  Bible text from SDARM editions &middot; an independent reader by
  <a href="https://github.com/TheMaestr-o" target="_blank" rel="noopener">Sergio</a>
</footer>

<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }

const LANGS=["de","en","ru"];
const LOCALE={de:"de-DE",en:"en-US",ru:"ru-RU"};
const BIBLE={de:"de-lut",en:"en-kjv",ru:"ru-rst"};
const WORD={
  key:{de:"Leittext",en:"Key Text",ru:"Памятный стих"},
  sabbath:{de:"Sabbat",en:"Sabbath",ru:"Суббота"},
  today:{de:"HEUTE",en:"TODAY",ru:"СЕГОДНЯ"},
  none:{de:"Für diesen Tag gibt es keine Lektion.",en:"No lesson for this day.",ru:"На этот день урока нет."},
  eyebrow:{de:"Sabbatschullektion",en:"Sabbath Bible Lesson",ru:"Урок субботней школы"}
};
let leftLang=localStorage.getItem("manna.web.left")||"de";
let rightLang=localStorage.getItem("manna.web.right")||"ru";
if(leftLang===rightLang) rightLang=leftLang==="de"?"ru":"de";
let current=new Date();
const quarters={},bibles={};

function ymd(d){return d.getFullYear()+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2);}
function sameDay(a,b){return ymd(a)===ymd(b);}
function qOf(d){return Math.floor(d.getMonth()/3)+1;}
function addDays(d,n){const x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
function neigh(y,q){return[[y,q],q===1?[y-1,4]:[y,q-1],q===4?[y+1,1]:[y,q+1]];}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function cleanMem(t){return String(t||"").replace(/^\s*[\p{Lu}][\p{Lu}\s]{2,}[:：]\s*/u,"").trim();}

async function loadQuarter(l,y,q){
  const key=l+"-"+y+"-"+q; if(quarters[key]) return quarters[key];
  try{const r=await fetch("https://app.sdarm.org/sbl/data/"+l+"/"+l+"-"+y+"-"+q+".json");if(!r.ok)throw 0;return quarters[key]=await r.json();}
  catch(e){return quarters[key]=null;}
}
async function findDay(d,l){
  const t=ymd(d);
  for(const[y,q]of neigh(d.getFullYear(),qOf(d))){
    const data=await loadQuarter(l,y,q); if(!data||!data.lessons) continue;
    for(const les of data.lessons){
      if(les.date===t) return {type:"sabbath",lesson:les};
      for(const day of les.dailyLessons||[]) if(day.date===t) return {type:"day",lesson:les,day};
    }
  }
  return {type:"none"};
}
function loadBible(v){ if(bibles[v]) return bibles[v];
  return bibles[v]=fetch("https://app.sdarm.org/bible/data/"+v+".json").then(r=>r.json()).catch(e=>{bibles[v]=null;return null;}); }
function parseSeg(s){const d=s.split("-");const a=d[0].split(".");const b=(d[1]||d[0]).split(".");
  return{book:a[0],chap:+a[1],v1:+a[2],echap:+(b[1]||a[1]),v2:+(b[2]||a[2])};}
function verseHtml(books,sOsis){let out="";
  for(const raw of String(sOsis).split(",")){
    const s=parseSeg(raw.trim());const ch=books&&books[s.book];if(!ch)continue;
    for(let c=s.chap;c<=s.echap;c++){const vs=ch[c-1];if(!vs)continue;
      const from=c===s.chap?s.v1:1,to=c===s.echap?s.v2:vs.length;
      for(let n=from;n<=to;n++) if(vs[n-1]!=null) out+='<span class="vnum">'+n+'</span>'+esc(String(vs[n-1]).trim())+" ";
    }
  }
  return out.trim();
}
function columnHtml(info,l,books){
  if(info.type==="none") return '<div class="msg">'+esc(WORD.none[l])+'</div>';
  const les=info.lesson;
  let h='<div class="kick">'+esc(les.header||"")+'</div><div class="title">'+esc(les.title||"")+'</div>';
  const kt=les.keyText||{};const kText=cleanMem(kt.text||les.keyTextVerse||"");const kRef=(kt.ref&&kt.ref.text)||"";
  if(kText) h+='<div class="mem"><div class="l">'+esc(WORD.key[l])+'</div><div class="t">'+esc(kText)+'</div>'+(kRef?'<div class="r">'+esc(kRef)+'</div>':'')+'</div>';
  if(info.type==="sabbath"){
    h+='<div class="section">'+esc(WORD.sabbath[l])+'</div>';
    if(les.keyNote&&les.keyNote.text) h+='<div class="note">'+esc(les.keyNote.text)+'</div>';
    const rd=les.reading; if(rd&&rd.reading&&rd.reading.length) h+='<div class="reading"><b>'+esc(rd.label||"")+'</b> '+rd.reading.map(x=>esc(x.label||"")).join("; ")+'</div>';
    return h;
  }
  const day=info.day;
  if(day.sectionTitle) h+='<div class="section">'+esc(day.sectionTitle.trim())+'</div>';
  for(const sub of day.subsections||[]){
    h+='<div class="qa">';
    for(const q of sub.q||[]){
      if(q.sOsis) h+='<div class="vref">'+esc((q.text||"").trim())+'</div><div class="verse">'+verseHtml(books,q.sOsis)+'</div>';
      else if(q.text) h+='<div class="q">'+esc(q.text.trim())+'</div>';
    }
    for(const q of sub.question||[]) if(q&&q.text) h+='<div class="q">'+esc(q.text.trim())+'</div>';
    for(const n of sub.note||[]) if(n&&n.text) h+='<div class="note">'+esc(n.text)+'</div>';
    h+='</div>';
  }
  for(const q of day.reviewQuestions||[]) if(q) h+='<div class="review">'+esc(q)+'</div>';
  return h;
}
function fmtDate(d,l){try{return new Intl.DateTimeFormat(LOCALE[l],{weekday:"long",day:"numeric",month:"long"}).format(d);}catch(e){return ymd(d);}}

let token=0;
async function render(){
  const my=++token;
  const isToday=sameDay(current,new Date());
  document.getElementById("eyebrow").textContent=WORD.eyebrow[leftLang];
  document.getElementById("date-d").textContent=fmtDate(current,leftLang);
  document.getElementById("date").classList.toggle("today",isToday);
  document.getElementById("date-s").textContent=isToday?WORD.today[leftLang]:String(current.getFullYear());
  buildSegs();
  const cols=document.getElementById("cols"); cols.innerHTML='<div class="msg">&hellip;</div>';
  const [li,ri,lb,rb]=await Promise.all([findDay(current,leftLang),findDay(current,rightLang),loadBible(BIBLE[leftLang]),loadBible(BIBLE[rightLang])]);
  if(my!==token) return;
  cols.innerHTML='<div class="col">'+columnHtml(li,leftLang,lb&&lb.books)+'</div><div class="col">'+columnHtml(ri,rightLang,rb&&rb.books)+'</div>';
}
function buildSegs(){
  for(const [id,cur,set] of [["seg-left",leftLang,setLeft],["seg-right",rightLang,setRight]]){
    const el=document.getElementById(id);
    el.innerHTML=LANGS.map(x=>'<div class="o'+(x===cur?' active':'')+'" data-l="'+x+'">'+x.toUpperCase()+'</div>').join("");
    el.querySelectorAll(".o").forEach(o=>o.onclick=()=>set(o.dataset.l));
  }
}
function setLeft(l){if(l===leftLang)return;if(l===rightLang)rightLang=leftLang;leftLang=l;save();render();}
function setRight(l){if(l===rightLang)return;if(l===leftLang)leftLang=rightLang;rightLang=l;save();render();}
function save(){localStorage.setItem("manna.web.left",leftLang);localStorage.setItem("manna.web.right",rightLang);}

document.getElementById("prev").onclick=()=>{current=addDays(current,-1);render();};
document.getElementById("next").onclick=()=>{current=addDays(current,1);render();};
document.getElementById("date").onclick=()=>{current=new Date();render();};
document.getElementById("swap").onclick=()=>{const t=leftLang;leftLang=rightLang;rightLang=t;save();render();};
document.getElementById("menu").onclick=()=>document.getElementById("drawer").classList.toggle("open");

render();
</script>
</body>
</html>
