<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MANNA — Sabbath Bible Lesson · parallel languages</title>
<meta name="description" content="The daily Sabbath Bible Lesson in two languages side by side — with the full Bible text, from sbl.sdarm.org.">
<style>
:root{
  --bg:#0e0c09; --panel:#171310; --card:#1e1912; --line:#403626; --hair:#2b2418;
  --ink:#e8e2d3; --ink-soft:#c3bba8; --dim:#928a78; --faint:#665e4d;
  --gold:#c9a24e; --gold-hi:#e9cf8f; --gold-dk:#8f6f2c; --on-gold:#1a1206;
  --scripture:#f0ebdd; --verse-bg:rgba(201,162,78,.07);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:"SF Pro Text",-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.62;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1200px 620px at 50% -260px, rgba(201,162,78,.16), transparent 62%),
    radial-gradient(900px 900px at 50% 120%, rgba(201,162,78,.05), transparent 60%),
    #0e0c09;
  min-height:100vh;
}
a{color:var(--gold-hi);text-decoration:none}
a:hover{color:var(--gold)}
.wrap{max-width:1220px;margin:0 auto;padding:0 26px}

/* ---------------- header ---------------- */
header{text-align:center;padding:64px 0 0}
.crest{width:46px;height:46px;margin:0 auto 20px;border-radius:50%;
  border:1px solid var(--gold-dk);display:flex;align-items:center;justify-content:center;
  color:var(--gold);font-size:20px;box-shadow:0 0 34px rgba(201,162,78,.18);background:radial-gradient(circle at 50% 35%, rgba(201,162,78,.14), transparent 70%)}
.wordmark{
  font-family:var(--serif);font-size:58px;font-weight:700;letter-spacing:16px;padding-left:16px;line-height:1;
  background:linear-gradient(100deg,#9a7a2f 0%,#d9b463 28%,#f8ecc4 46%,#d9b463 64%,#9a7a2f 100%);
  background-size:230% auto;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#d9b463;
}
.rule{display:flex;align-items:center;justify-content:center;gap:14px;margin:22px 0 12px}
.rule .ln{width:96px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dk))}
.rule .ln.r{background:linear-gradient(90deg,var(--gold-dk),transparent)}
.rule .dot{color:var(--gold);font-size:9px}
.tagline{color:var(--gold);font-size:11.5px;font-weight:600;letter-spacing:4px;text-transform:uppercase}

/* ---------------- controls ---------------- */
.controls{position:sticky;top:0;z-index:8;margin-top:34px;
  background:linear-gradient(180deg,rgba(14,12,9,.92),rgba(14,12,9,.72));backdrop-filter:blur(12px);
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.controls .row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px 22px;padding:15px 26px;max-width:1220px;margin:0 auto}
.daynav{display:flex;align-items:center;gap:8px}
.arrow{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:var(--card);border:1px solid var(--line);color:var(--gold);font-size:22px;cursor:pointer;user-select:none;
  transition:.18s}
.arrow:hover{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--on-gold);border-color:var(--gold)}
.date{min-width:220px;text-align:center;cursor:pointer;padding:5px 10px;border-radius:11px;transition:.18s}
.date:hover{background:var(--card)}
.date .d{font-family:var(--serif);font-size:18px;font-weight:600;text-transform:capitalize;color:var(--ink)}
.date .s{font-size:9.5px;letter-spacing:2.5px;color:var(--faint);margin-top:2px}
.date.today .s{color:var(--gold);font-weight:700}
.pickset{display:flex;align-items:center;gap:9px}
.pk-label{font-size:9.5px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--faint)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.02)}
.seg .o{padding:8px 13px;font-size:12px;font-weight:700;letter-spacing:1px;color:var(--dim);cursor:pointer;transition:.15s}
.seg .o:hover{color:var(--ink)}
.seg .o.active{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--on-gold);text-shadow:0 1px 0 rgba(255,255,255,.25)}
.swap{width:38px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:9px;
  background:var(--card);border:1px solid var(--line);color:var(--gold);cursor:pointer;font-size:16px;transition:.18s}
.swap:hover{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--on-gold)}

/* ---------------- columns ---------------- */
.cols{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:56px;padding:44px 0 90px}
.cols::before{content:"";position:absolute;top:20px;bottom:60px;left:50%;width:1px;transform:translateX(-.5px);
  background:linear-gradient(180deg,transparent,var(--gold-dk) 12%,var(--gold-dk) 88%,transparent)}
.col{min-width:0}
.msg{grid-column:1 / -1;text-align:center;color:var(--faint);padding:90px 20px;font-family:var(--serif);font-size:18px}
.msg.err{color:#c98}

.kick{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.title{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.16;color:var(--ink);margin-bottom:22px}

.mem{position:relative;background:linear-gradient(180deg,rgba(201,162,78,.05),rgba(201,162,78,.015));
  border:1px solid var(--line);border-radius:12px;padding:24px 22px 20px;margin-bottom:30px;
  box-shadow:0 20px 40px -28px rgba(0,0,0,.8)}
.mem::before{content:"\201C";position:absolute;top:-6px;left:14px;font-family:var(--serif);font-size:64px;line-height:1;color:var(--gold);opacity:.32}
.mem .l{font-size:9.5px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);margin-bottom:9px}
.mem .t{font-family:var(--serif);font-size:19px;line-height:1.55;color:var(--scripture)}
.mem .r{font-size:12.5px;font-weight:600;color:var(--gold-hi);margin-top:11px;letter-spacing:.3px}

.section{font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--ink-soft);
  display:flex;align-items:center;gap:14px;margin:8px 0 24px}
.section::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold-dk),transparent)}

.qa{margin-bottom:8px}
.qa:not(:last-child)::after{content:"\2766";display:block;text-align:center;color:var(--gold);opacity:.36;font-size:16px;margin:26px 0}
.q{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.5;color:var(--ink);margin-bottom:13px}
.vref{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.verse{position:relative;background:var(--verse-bg);border-left:2px solid var(--gold);border-radius:0 8px 8px 0;
  padding:14px 17px;margin-bottom:12px;font-family:var(--serif);font-size:18px;line-height:1.72;color:var(--scripture)}
.vnum{font-family:var(--sans);font-weight:700;font-size:10px;color:var(--gold);vertical-align:5px;margin:0 4px 0 1px}
.note{position:relative;font-size:15px;line-height:1.66;color:var(--dim);padding-left:17px;margin-top:13px}
.note::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:1px;background:var(--gold-dk);opacity:.5}
.review{font-family:var(--serif);font-size:16.5px;color:var(--ink-soft);line-height:1.55;margin-bottom:15px}
.reading{font-size:14.5px;color:var(--dim);margin-top:12px}
.reading b{color:var(--ink-soft)}

footer{text-align:center;color:var(--faint);font-size:12.5px;padding:30px 0 46px;border-top:1px solid var(--hair)}
footer .fl{color:var(--gold);font-size:9px;letter-spacing:2px}

/* ---------------- animations ---------------- */
@media (prefers-reduced-motion:no-preference){
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes riseIn{from{opacity:0;transform:translateY(20px) scale(.995)}to{opacity:1;transform:none}}
  @keyframes shimmer{to{background-position:-230% 0}}
  @keyframes glow{0%,100%{opacity:.85}50%{opacity:1}}
  @keyframes drawline{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes pop{0%{opacity:0;transform:scale(.6) rotate(-8deg)}70%{transform:scale(1.12)}100%{opacity:.36;transform:none}}

  .crest{animation:fadeUp .7s both, glow 4.5s ease-in-out 1s infinite}
  .wordmark{animation:fadeUp .85s .05s both, shimmer 5.5s linear 1.3s infinite}
  .rule .ln{transform-origin:right;animation:drawline .8s .35s both}
  .rule .ln.r{transform-origin:left}
  .rule .dot{animation:fadeUp .6s .5s both}
  .tagline{animation:fadeUp .8s .3s both}
  .controls{animation:fadeUp .6s .25s both}

  /* content re-animates on every day / language change (innerHTML replaced) */
  .col{animation:riseIn .55s both}
  .col:nth-child(2){animation-delay:.09s}
  .col .kick{animation:fadeUp .5s .04s both}
  .col .title{animation:fadeUp .55s .09s both}
  .col .mem{animation:fadeUp .6s .16s both}
  .col .section{animation:fadeUp .55s .22s both}
  .col .qa{animation:fadeUp .55s .26s both}
  .col .qa:nth-of-type(2){animation-delay:.34s}
  .col .qa:nth-of-type(3){animation-delay:.42s}
  .col .qa:nth-of-type(n+4){animation-delay:.5s}
  .col .review{animation:fadeUp .5s .2s both}
  .qa:not(:last-child)::after{animation:pop .6s .3s both}

  .arrow,.swap,.seg .o,.date,.verse{transition:.2s}
  .verse:hover{border-left-width:3px;background:rgba(201,162,78,.11)}
}

@media (max-width:840px){
  .cols{grid-template-columns:1fr;gap:0}
  .cols::before{display:none}
  .col{border-bottom:1px solid var(--hair);padding-bottom:30px;margin-bottom:24px}
  .col:last-child{border-bottom:none}
  .wordmark{font-size:40px;letter-spacing:10px}
}
</style>
</head>
<body>

<header>
  <div class="crest">&#10086;</div>
  <div class="wordmark">MANNA</div>
  <div class="rule"><span class="ln"></span><span class="dot">&#9670;</span><span class="ln r"></span></div>
  <div class="tagline">Sabbath Bible Lesson &middot; two languages, side by side</div>
</header>

<div class="controls">
  <div class="row">
    <div class="daynav">
      <div class="arrow" id="prev" title="Previous day">&lsaquo;</div>
      <div class="date" id="date" title="Jump to today"><div class="d" id="date-d">&mdash;</div><div class="s" id="date-s"></div></div>
      <div class="arrow" id="next" title="Next day">&rsaquo;</div>
    </div>
    <div class="pickset">
      <span class="pk-label">Left</span>
      <div class="seg" id="seg-left"></div>
      <div class="swap" id="swap" title="Swap sides">&#8646;</div>
      <span class="pk-label">Right</span>
      <div class="seg" id="seg-right"></div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="cols" id="cols"><div class="msg">Loading&hellip;</div></div>
</div>

<footer>
  <div class="fl">&#10022;</div>
  Content &copy; <a href="https://sdarm.org" target="_blank" rel="noopener">Seventh Day Adventist Reform Movement</a> &middot;
  Bible text from SDARM editions &middot; an independent reader by
  <a href="https://github.com/TheMaestr-o" target="_blank" rel="noopener">Sergio</a>
  <div style="margin-top:10px;font-size:11px;letter-spacing:1px;text-transform:uppercase"><a href="codex.html" style="color:var(--gold)">Illuminated edition &#8594;</a></div>
</footer>

<script>
const LANGS=["de","en","ru"];
const LOCALE={de:"de-DE",en:"en-US",ru:"ru-RU"};
const BIBLE={de:"de-lut",en:"en-kjv",ru:"ru-rst"};
const WORD={
  key:{de:"Leittext",en:"Key Text",ru:"Памятный стих"},
  sabbath:{de:"Sabbat",en:"Sabbath",ru:"Суббота"},
  today:{de:"HEUTE",en:"TODAY",ru:"СЕГОДНЯ"},
  none:{de:"Für diesen Tag gibt es keine Lektion.",en:"No lesson for this day.",ru:"На этот день урока нет."}
};

let leftLang=localStorage.getItem("manna.web.left")||"de";
let rightLang=localStorage.getItem("manna.web.right")||"ru";
if(leftLang===rightLang) rightLang=leftLang==="de"?"ru":"de";
let current=new Date();
const quarters={},bibles={};

function ymd(d){return d.getFullYear()+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2);}
function sameDay(a,b){return ymd(a)===ymd(b);}
function qOf(d){return Math.floor(d.getMonth()/3)+1;}
function addDays(d,n){const x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
function neigh(y,q){return[[y,q],q===1?[y-1,4]:[y,q-1],q===4?[y+1,1]:[y,q+1]];}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function cleanMem(t){return String(t||"").replace(/^\s*[\p{Lu}][\p{Lu}\s]{2,}[:：]\s*/u,"").trim();}

async function loadQuarter(l,y,q){
  const key=l+"-"+y+"-"+q; if(quarters[key]) return quarters[key];
  try{const r=await fetch("https://app.sdarm.org/sbl/data/"+l+"/"+l+"-"+y+"-"+q+".json");if(!r.ok)throw 0;return quarters[key]=await r.json();}
  catch(e){return quarters[key]=null;}
}
async function findDay(d,l){
  const t=ymd(d);
  for(const[y,q]of neigh(d.getFullYear(),qOf(d))){
    const data=await loadQuarter(l,y,q); if(!data||!data.lessons) continue;
    for(const les of data.lessons){
      if(les.date===t) return {type:"sabbath",lesson:les};
      for(const day of les.dailyLessons||[]) if(day.date===t) return {type:"day",lesson:les,day};
    }
  }
  return {type:"none"};
}
function loadBible(v){ if(bibles[v]) return bibles[v];
  return bibles[v]=fetch("https://app.sdarm.org/bible/data/"+v+".json").then(r=>r.json()).catch(e=>{bibles[v]=null;return null;}); }
function parseSeg(s){const d=s.split("-");const a=d[0].split(".");const b=(d[1]||d[0]).split(".");
  return{book:a[0],chap:+a[1],v1:+a[2],echap:+(b[1]||a[1]),v2:+(b[2]||a[2])};}
function verseHtml(books,sOsis){let out="";
  for(const raw of String(sOsis).split(",")){
    const s=parseSeg(raw.trim());const ch=books&&books[s.book];if(!ch)continue;
    for(let c=s.chap;c<=s.echap;c++){const vs=ch[c-1];if(!vs)continue;
      const from=c===s.chap?s.v1:1,to=c===s.echap?s.v2:vs.length;
      for(let n=from;n<=to;n++) if(vs[n-1]!=null) out+='<span class="vnum">'+n+'</span>'+esc(String(vs[n-1]).trim())+" ";
    }
  }
  return out.trim();
}
function columnHtml(info,l,books){
  if(info.type==="none") return '<div class="msg">'+esc(WORD.none[l])+'</div>';
  const les=info.lesson;
  let h='<div class="kick">'+esc(les.header||"")+'</div><div class="title">'+esc(les.title||"")+'</div>';
  const kt=les.keyText||{};const kText=cleanMem(kt.text||les.keyTextVerse||"");const kRef=(kt.ref&&kt.ref.text)||"";
  if(kText) h+='<div class="mem"><div class="l">'+esc(WORD.key[l])+'</div><div class="t">'+esc(kText)+'</div>'+(kRef?'<div class="r">'+esc(kRef)+'</div>':'')+'</div>';
  if(info.type==="sabbath"){
    h+='<div class="section">'+esc(WORD.sabbath[l])+'</div>';
    if(les.keyNote&&les.keyNote.text) h+='<div class="note">'+esc(les.keyNote.text)+'</div>';
    const rd=les.reading; if(rd&&rd.reading&&rd.reading.length) h+='<div class="reading"><b>'+esc(rd.label||"")+'</b> '+rd.reading.map(x=>esc(x.label||"")).join("; ")+'</div>';
    return h;
  }
  const day=info.day;
  if(day.sectionTitle) h+='<div class="section">'+esc(day.sectionTitle.trim())+'</div>';
  for(const sub of day.subsections||[]){
    h+='<div class="qa">';
    for(const q of sub.q||[]){
      if(q.sOsis) h+='<div class="vref">'+esc((q.text||"").trim())+'</div><div class="verse">'+verseHtml(books,q.sOsis)+'</div>';
      else if(q.text) h+='<div class="q">'+esc(q.text.trim())+'</div>';
    }
    for(const q of sub.question||[]) if(q&&q.text) h+='<div class="q">'+esc(q.text.trim())+'</div>';
    for(const n of sub.note||[]) if(n&&n.text) h+='<div class="note">'+esc(n.text)+'</div>';
    h+='</div>';
  }
  for(const q of day.reviewQuestions||[]) if(q) h+='<div class="review">'+esc(q)+'</div>';
  return h;
}
function fmtDate(d,l){try{return new Intl.DateTimeFormat(LOCALE[l],{weekday:"long",day:"numeric",month:"long"}).format(d);}catch(e){return ymd(d);}}

let token=0;
async function render(){
  const my=++token;
  const isToday=sameDay(current,new Date());
  document.getElementById("date-d").textContent=fmtDate(current,leftLang);
  document.getElementById("date").classList.toggle("today",isToday);
  document.getElementById("date-s").textContent=isToday?WORD.today[leftLang]:String(current.getFullYear());
  buildSegs();
  const cols=document.getElementById("cols"); cols.innerHTML='<div class="msg">Loading&hellip;</div>';
  const [li,ri,lb,rb]=await Promise.all([findDay(current,leftLang),findDay(current,rightLang),loadBible(BIBLE[leftLang]),loadBible(BIBLE[rightLang])]);
  if(my!==token) return;
  cols.innerHTML='<div class="col">'+columnHtml(li,leftLang,lb&&lb.books)+'</div><div class="col">'+columnHtml(ri,rightLang,rb&&rb.books)+'</div>';
}
function buildSegs(){
  for(const [id,cur,set] of [["seg-left",leftLang,setLeft],["seg-right",rightLang,setRight]]){
    const el=document.getElementById(id);
    el.innerHTML=LANGS.map(x=>'<div class="o'+(x===cur?' active':'')+'" data-l="'+x+'">'+x.toUpperCase()+'</div>').join("");
    el.querySelectorAll(".o").forEach(o=>o.onclick=()=>set(o.dataset.l));
  }
}
function setLeft(l){if(l===leftLang)return;if(l===rightLang)rightLang=leftLang;leftLang=l;save();render();}
function setRight(l){if(l===rightLang)return;if(l===leftLang)leftLang=rightLang;rightLang=l;save();render();}
function save(){localStorage.setItem("manna.web.left",leftLang);localStorage.setItem("manna.web.right",rightLang);}

document.getElementById("prev").onclick=()=>{current=addDays(current,-1);render();};
document.getElementById("next").onclick=()=>{current=addDays(current,1);render();};
document.getElementById("date").onclick=()=>{current=new Date();render();};
document.getElementById("swap").onclick=()=>{const t=leftLang;leftLang=rightLang;rightLang=t;save();render();};

render();
</script>
</body>
</html>
